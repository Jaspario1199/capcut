[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "capcut-recreate"
version = "0.1.0"
description = "Recreate a complex CapCut project with new footage and text: deterministic slot filling on top of capcut-cli, with an optional LLM planner."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
scenes = ["scenedetect[opencv]>=0.6"]
dev = ["pytest>=8"]

[project.scripts]
capcut-recreate = "capcut_recreate.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
